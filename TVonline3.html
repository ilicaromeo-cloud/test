const CATEGORIES = ['Toate', ...Array.from(new Set(CHANNELS.map(c => c.category)))];
let activeCategory = 'Toate'; let query = ''; let hls = null; let hlsLoader = null; let abortController = null;
const grid = document.getElementById('grid'); const filters = document.getElementById('filters'); const empty = document.getElementById('empty'); const search = document.getElementById('search'); const clear = document.getElementById('clear');
const totalCount = document.getElementById('total-count'); const resultCount = document.getElementById('result-count'); const sectionTitle = document.getElementById('section-title');
const modal = document.getElementById('modal'); const video = document.getElementById('video'); const playerStatus = document.getElementById('player-status'); const modalTitle = document.getElementById('modal-title'); const sourceLink = document.getElementById('source-link'); const sourceLinkBottom = document.getElementById('source-link-bottom'); const close = document.getElementById('close');
const fallback = name => (name || '?').trim().charAt(0).toUpperCase();
const norm = value => (value || '').toLocaleLowerCase('ro').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const escapeHtml = value => String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));
function renderFilters(){ filters.innerHTML = CATEGORIES.map(cat => '<button class="chip '+(cat===activeCategory?'active':'')+'" data-category="'+escapeHtml(cat)+'">'+escapeHtml(cat)+'</button>').join(''); }
function filtered(){ const q=norm(query); return CHANNELS.filter(c => (activeCategory==='Toate'||c.category===activeCategory) && (!q||norm(c.name).includes(q)||norm(c.category).includes(q))); }
function render(){
  const items=filtered(); if(totalCount) totalCount.textContent=CHANNELS.length; if(resultCount) resultCount.textContent=items.length+' rezultate'; if(sectionTitle) sectionTitle.textContent=activeCategory==='Toate'?'Toate canalele':activeCategory; empty.style.display=items.length?'none':'block';
  grid.innerHTML=items.map(c=>'<button class="card" data-index="'+CHANNELS.indexOf(c)+'" aria-label="Deschide '+escapeHtml(c.name)+'"><div class="card-top"><div class="logo"><img src="'+new URL(c.icon,ORIGIN).href+'" alt="" loading="lazy" data-fallback="'+escapeHtml(fallback(c.name))+'"></div><span class="fav" aria-hidden="true">☆</span></div><div class="name">'+escapeHtml(c.name)+'</div><div class="category">'+escapeHtml(c.category)+'</div><div class="card-bottom"><span class="watch">Redare live</span><span>▶</span></div></button>').join('');
  grid.querySelectorAll('.logo img').forEach(img=>img.addEventListener('error',()=>{ const box=img.parentElement; box.textContent=img.dataset.fallback||'?'; }));
}
function showStatus(title, text){ playerStatus.innerHTML='<div><strong>'+escapeHtml(title)+'</strong>'+escapeHtml(text)+'</div>'; playerStatus.classList.remove('hidden'); }
function hideStatus(){ playerStatus.classList.add('hidden'); }
function stopPlayback(){ if(abortController){abortController.abort();abortController=null;} if(hls){hls.destroy();hls=null;} video.pause(); video.removeAttribute('src'); video.load(); }
function loadHls(){
  if(window.Hls) return Promise.resolve(window.Hls);
  if(hlsLoader) return hlsLoader;
  hlsLoader = new Promise((resolve,reject)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js'; s.onload=()=>resolve(window.Hls); s.onerror=()=>reject(new Error('Biblioteca HLS nu s-a încărcat')); document.head.appendChild(s); });
  return hlsLoader;
}
async function playStream(url){
  video.hidden=false; video.controls=true;
  if(video.canPlayType('application/vnd.apple.mpegurl')){ video.src=url; await video.play().catch(()=>{}); hideStatus(); return; }
  const HlsClass = await loadHls();
  if(!HlsClass || !HlsClass.isSupported()) throw new Error('Browserul nu suportă redarea HLS');
  hls = new HlsClass({enableWorker:true, lowLatencyMode:true});
  hls.on(HlsClass.Events.ERROR,(event,data)=>{ if(data && data.fatal) showStatus('Redarea s-a oprit','Folosește butonul „Deschide în tab nou” pentru pagina canalului.'); });
  hls.loadSource(url); hls.attachMedia(video); hls.on(HlsClass.Events.MANIFEST_PARSED,()=>{ video.play().catch(()=>{}); hideStatus(); });
}
async function resolveDirect(c, signal){
  const pageUrl=ORIGIN+c.path;
  const pageResponse=await fetch(pageUrl,{mode:'cors',credentials:'omit',headers:{Accept:'text/html'},signal});
  if(!pageResponse.ok) throw new Error('Pagina canalului nu permite CORS');
  const page=await pageResponse.text();
  const slugMatch=page.match(/\bvar\s+_slug\s*=\s*[\'"]([^\'"]+)[\'"]/);
  const tokenMatch=page.match(/\b_pageToken\s*=\s*[\'"]([^\'"]+)[\'"]/);
  if(!slugMatch || !tokenMatch) throw new Error('Slug sau token lipsă');
  const streamResponse=await fetch(ORIGIN+'stream.php',{method:'POST',mode:'cors',credentials:'omit',headers:{Accept:'application/json, text/plain, */*','Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:new URLSearchParams({s:slugMatch[1],pt:tokenMatch[1]}),signal});
  if(!streamResponse.ok) throw new Error('stream.php nu permite CORS');
  const data=await streamResponse.json();
  if(!data.url) throw new Error('TVZoneHD nu a returnat URL-ul fluxului');
  return data;
}
async function openChannel(c){
  stopPlayback(); const pageUrl=ORIGIN+c.path; modalTitle.textContent=c.name; sourceLink.href=pageUrl; sourceLinkBottom.href=pageUrl; modal.classList.add('open'); document.body.style.overflow='hidden'; close.focus();
  if(!workerReady()){ showStatus('Resolver neconfigurat','Apasa butonul „Resolver” din bara de sus si pune adresa Cloudflare Worker-ului (ex: https://tvzone-cors.numele-tau.workers.dev).'); return; }
  showStatus('Se pregateste redarea','Asteapta...');
  abortController = new AbortController();
  try{
    const response=await fetch(workerBase()+'/resolve?path='+encodeURIComponent(c.path),{headers:{Accept:'application/json'},signal:abortController.signal});
    const payload=await response.json().catch(()=>({}));
    if(!response.ok || !payload.ok || !payload.url) throw new Error(payload.error||'Resolver indisponibil');
    /* Manifestul TVZoneHD (akamaisqli.app) trimite Access-Control-Allow-Origin: *
       deci se poate reda direct, fara proxy. Daca totusi da eroare, se reia prin worker. */
    try{
      await playStream(payload.url);
    }catch(err){
      await playStream(workerBase()+'/hls?url='+encodeURIComponent(payload.url));
    }
  }catch(error){
    if(error.name==='AbortError') return;
    showStatus('Nu s-a putut porni canalul', (error && error.message ? error.message+'. ' : '')+'Verifica adresa worker-ului sau deschide pagina directa a canalului.');
  }
}
function closeModal(){ modal.classList.remove('open'); stopPlayback(); document.body.style.overflow=''; }
filters.addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;activeCategory=b.dataset.category;renderFilters();render();});
grid.addEventListener('click',e=>{const card=e.target.closest('[data-index]');if(card)openChannel(CHANNELS[Number(card.dataset.index)]);});
search.addEventListener('input',e=>{query=e.target.value;clear.classList.toggle('show',!!query);render();});
clear.addEventListener('click',()=>{search.value='';query='';clear.classList.remove('show');search.focus();render();});
close.addEventListener('click',closeModal); modal.addEventListener('click',e=>{if(e.target===modal)closeModal();}); document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeModal();});
document.getElementById('cfg-btn').addEventListener('click',()=>{
  const current = workerReady() ? workerBase() : '';
  const value = prompt('Adresa resolverului CORS (Cloudflare Worker), ex:\nhttps://tvzone-cors.numele-tau.workers.dev', current);
  if(value===null) return;
  WORKER_URL = value.trim();
  try{ localStorage.setItem('tvzone_worker', WORKER_URL); }catch(e){}
  alert(workerReady() ? 'Resolver salvat: '+workerBase() : 'Adresa pare invalida. Trebuie sa incepa cu https://');
});
renderFilters(); render();
