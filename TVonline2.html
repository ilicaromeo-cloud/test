  if (!proxyBase) return src;
  return proxyBase + encodeURIComponent(src);
}
function playableUrl(url){
  if (!url) return '';
  var src = sourceFromUrl(url);
  if (/magicplaces\.eu/i.test(src) || /\.m3u8(?:$|[?#])/i.test(src)) return proxiedUrl(src, PROXY_BASES[0]);
  return src || url;
}
function sourceWithHost(url, host){
  var src = sourceFromUrl(url);
  if (!/magicplaces\.eu/i.test(src)) return url;
  src = src.replace(/https?:\/\/[^/]+/i, 'https://' + host);
  return src;
}
function candidateUrls(c){
  var src = sourceFromUrl(c.u);
  var sources = [];
  var list = [];
  function addSource(u){
    if (u && sources.indexOf(u) < 0) sources.push(u);
  }
  addSource(src);
  if (/magicplaces\.eu/i.test(src)){
    MAGIC_HOSTS.forEach(function(host){ addSource(sourceWithHost(c.u, host)); });
  }
  sources.forEach(function(source){
    PROXY_BASES.forEach(function(proxyBase){
      var candidate = proxiedUrl(source, proxyBase);
      if (candidate && list.indexOf(candidate) < 0) list.push(candidate);
    });
  });
  return list;
}
function cacheList(){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({at:Date.now(), channels:CH})); } catch(e){}
}
function categoryName(value){
  var v = norm(String(value || '')).replace(/^tv-/, '');
  var map = {generaliste:'Generaliste', sport:'Sport', filme:'Filme', stiri:'Stiri',
    documentare:'Documentare', copii:'Copii', muzica:'Muzica', diverse:'Diverse',
    regionale:'Regionale', religioase:'Religioase'};
  return map[v] || CATS.filter(function(x){ return norm(x) === v; })[0] || 'Diverse';
}
function firstValue(obj, keys){
  for (var i = 0; i < keys.length; i++){
    if (obj && obj[keys[i]] !== undefined && obj[keys[i]] !== null && obj[keys[i]] !== '') return obj[keys[i]];
  }
  return '';
}
function normalizeChannel(obj){
  if (!obj || typeof obj !== 'object') return null;
  var name = firstValue(obj, ['n','name','title','channel_name','channelName']);
  if (name && typeof name === 'object') name = firstValue(name, ['rendered','name','title']);
  var stream = firstValue(obj, ['u','url','stream','stream_url','streamUrl','hls','hls_url','playlist','source','src','embed_url','player_url','play_url']);
  var logo = firstValue(obj, ['l','logo','logo_url','logoUrl','image','image_url','imageUrl','thumbnail','thumbnail_url']);
  if (stream && typeof stream === 'object') stream = firstValue(stream, ['url','src','stream','hls']);
  if (logo && typeof logo === 'object') logo = firstValue(logo, ['url','src','source']);
  if (!name || typeof name !== 'string') return null;
  if (!stream || typeof stream !== 'string') return null;
  var rawCats = firstValue(obj, ['c','category','categories','cat','genre']);
  if (!Array.isArray(rawCats)) rawCats = rawCats ? [rawCats] : [];
  return {n:name.replace(/<[^>]+>/g,'').trim(), l:logo || logoFallback(name),
    c:rawCats.map(function(x){ return typeof x === 'object' ? firstValue(x, ['name','slug','title']) : x; }).map(categoryName),
    u:playableUrl(stream)};
}
function collectChannels(value, out, seen){
  if (!value) return;
  if (Array.isArray(value)){ value.forEach(function(x){ collectChannels(x, out, seen); }); return; }
  if (typeof value !== 'object') return;
  var item = normalizeChannel(value);
  if (item){
    var key = norm(item.n);
    if (!seen[key]) { seen[key] = true; out.push(item); }
  }
  Object.keys(value).forEach(function(k){
    if (k !== 'n' && k !== 'name' && k !== 'title' && k !== 'u' && k !== 'url' &&
        k !== 'stream' && k !== 'stream_url' && k !== 'logo' && k !== 'image') {
      collectChannels(value[k], out, seen);
    }
  });
}
function syncChannels(){
  if (!SOURCE_API) {
    status.textContent = 'Sursă: lista locală rds.live · redare cu fallback automat · RomyLive+ 2';
    return;
  }
  if (!window.fetch) return;
  fetch(SOURCE_API + '?_=' + Date.now(), {
    method:'POST', headers:{'Accept':'application/json','Content-Type':'application/json'},
    body:'{}', cache:'no-store'
  }).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(data){
    var fresh = [], seen = {};
    collectChannels(data, fresh, seen);
    if (!fresh.length) throw new Error('format necunoscut');
    CH = fresh;
    document.getElementById('cnt').textContent = CH.length + ' canale';
    cacheList();
    render();
    status.textContent = 'Sursă: rds.live · lista actualizată la ' +
      new Date().toLocaleTimeString('ro-RO', {hour:'2-digit', minute:'2-digit'}) +
      ' · redare prin hls-proxy · RomyLive+ 2';
  }).catch(function(){
    status.textContent = 'Sursă: rds.live · se folosește lista locală de rezervă · RomyLive+ 2';
  });
}
function render(){
  var nq = norm(q), out = [];
  for (var i = 0; i < CH.length; i++){
    var c = CH[i];
    if (cur !== 'Toate' && c.c.indexOf(cur) < 0) continue;
    if (nq && norm(c.n).indexOf(nq) < 0) continue;
    out.push(c);
  }
  grid.innerHTML = '';
  empty.style.display = out.length ? 'none' : 'block';
  var frag = document.createDocumentFragment();
  out.forEach(function(c){
    var d = document.createElement('div');
    d.className = 'card'; d.tabIndex = 0;
    var t = document.createElement('div'); t.className = 'thumb';
    if (c.l && !isFallbackLogo(c.l)){
      var im = document.createElement('img');
      im.loading = 'lazy'; im.src = c.l; im.alt = c.n;
      im.onerror = function(){
        t.innerHTML = '';
        var replacement = document.createElement('img');
        replacement.src = logoFallback(c.n); replacement.alt = c.n;
        t.appendChild(replacement);
      };
      t.appendChild(im);
    } else {
      var fallback = document.createElement('img');
      fallback.src = logoFallback(c.n); fallback.alt = c.n;
      t.appendChild(fallback);
    }
    var n = document.createElement('div'); n.className = 'name'; n.textContent = c.n;
    d.appendChild(t); d.appendChild(n);
    d.onclick = function(){ play(c); };
    d.onkeydown = function(e){ if(e.key === 'Enter' || e.keyCode === 13 || e.keyCode === 23){ play(c); } };
    frag.appendChild(d);
  });
  grid.appendChild(frag);
}

/* --- auto-ascundere bara (nume canal + buton Inchide) dupa 5 sec --- */
var barTimer = null, barVisible = true;
function showBar(){
  barVisible = true;
  document.getElementById('bar').classList.remove('hid');
  if (barTimer) clearTimeout(barTimer);
  if (window.__modalOpen){
    barTimer = setTimeout(hideBar, 5000);
  }
}
function hideBar(){
  if (!window.__modalOpen) return;
  barVisible = false;
  document.getElementById('bar').classList.add('hid');
}
function armBar(){ showBar(); }
['mousemove','mousedown','click','touchstart','touchmove','wheel'].forEach(function(ev){
  pl.addEventListener(ev, function(){ if (window.__modalOpen) showBar(); }, {passive:true});
});
document.addEventListener('keydown', function(){ if (window.__modalOpen) showBar(); }, true);

function stop(){
  if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
  try { if (hls) { hls.destroy(); hls = null; } } catch(e){}
  try { vid.pause(); vid.removeAttribute('src'); vid.load(); } catch(e){}
}

function play(c, candidateIndex){
  stop();
  ttl.textContent = c.n;
  hint.textContent = 'Se \încarc\ă...';
  pl.classList.add('on');
  window.__modalOpen = true;
  try { closeBtn.focus(); } catch(e){}
  showBar();
  try { if (location.hash !== '#player-on') location.hash = 'player-on'; } catch(e){}

  var urls = candidateUrls(c);
  var url = urls[candidateIndex || 0] || c.u;
  activeCandidate = candidateIndex || 0;
  if (loadTimer) clearTimeout(loadTimer);
  loadTimer = setTimeout(function(){
    if (!window.__modalOpen) return;
    if (activeCandidate + 1 < urls.length) {
      hint.textContent = 'Se încearcă următoarea sursă...';
      play(c, activeCandidate + 1);
    } else {
      hint.textContent = 'Sursa nu răspunde: ' + sourceFromUrl(url);
    }
  }, 7000);
  var native = vid.canPlayType('application/vnd.apple.mpegurl');
  if (window.Hls && window.Hls.isSupported()){
    hls = new window.Hls({
      lowLatencyMode:false,
      backBufferLength:30,
      manifestLoadingTimeOut:4500,
      manifestLoadingMaxRetry:0,
      levelLoadingTimeOut:4500,
      levelLoadingMaxRetry:1,
      fragLoadingTimeOut:8000,
      fragLoadingMaxRetry:1
    });
    hls.loadSource(url);
    hls.attachMedia(vid);
    hls.on(window.Hls.Events.MANIFEST_PARSED, function(){ if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; } hint.textContent=''; vid.play().catch(function(){}); });
    hls.on(window.Hls.Events.ERROR, function(evt, data){
      if (!data.fatal) return;
      if ((data.type === window.Hls.ErrorTypes.NETWORK_ERROR ||
           data.type === window.Hls.ErrorTypes.MEDIA_ERROR) &&
          activeCandidate + 1 < urls.length) {
        try { hls.destroy(); } catch(e){}
        hls = null;
        hint.textContent = 'Se caută serverul activ...';
        play(c, activeCandidate + 1);
      } else if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR) { hls.startLoad(); }
      else if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); }
      else if (activeCandidate + 1 < urls.length) {
      } else { hint.textContent = 'Canalul nu r\ăspunde. \Încearc\ă alt canal.'; }
    });
  } else {
    vid.src = url;
    vid.addEventListener('loadedmetadata', function(){ if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; } hint.textContent=''; vid.play().catch(function(){}); }, { once:true });
    vid.addEventListener('error', function(){
      if (activeCandidate + 1 < urls.length) play(c, activeCandidate + 1);
      else hint.textContent = 'Canalul nu r\ăspunde. \Încearc\ă alt canal.';
    }, { once:true });
  }
}

function closePlayer(){
  stop();
  if (barTimer) { clearTimeout(barTimer); barTimer = null; }
  barVisible = true;
  document.getElementById('bar').classList.remove('hid');
  pl.classList.remove('on');
  hint.textContent = '';
  window.__modalOpen = false;
  try { if (location.hash === '#player-on') location.hash = 'player-off'; } catch(e){}
  return true;
}

window.__closeModal = closePlayer;
window.__romyPlayerAction = function(){ try { if (vid.paused) { vid.play(); } else { vid.pause(); } } catch(e){} };
closeBtn.onclick = function(){ if (!barVisible){ showBar(); return; } closePlayer(); };
closeBtn.onkeydown = function(e){
  if(e.key === 'Enter' || e.keyCode === 13){
    if (!barVisible){ showBar(); e.preventDefault(); return; }
    closePlayer();
  }
};
document.addEventListener('keydown', function(e){
  if (e.keyCode === 4 || e.key === 'Escape' || e.keyCode === 27){
    if (window.__modalOpen){ closePlayer(); e.preventDefault(); }
  }
});
search.addEventListener('input', function(){ q = search.value || ''; render(); });
render();
syncChannels();
</script>
