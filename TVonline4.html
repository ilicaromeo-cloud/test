  barOn = true;
  bar.style.display = '';
  hint.style.display = '';
  bar.classList.remove('off');
  hint.classList.remove('off');
  hot.style.display = 'none';
  pl.classList.remove('on');
  fr.src = 'about:blank';
  window.__modalOpen = false;
  try { if (location.hash === '#player-on') location.hash = 'player-off'; } catch(e){}
  return true;
}

window.__closeModal = closePlayer;
closeBtn.onclick = closePlayer;
closeBtn.onkeydown = function(e){ var k = e.keyCode || 0; if(e.key === 'Enter' || e.key === 'Select' || k === 13 || k === 23 || k === 66){ e.preventDefault(); closePlayer(); } };

/* ================= bara: auto-hide dupa 10s de inactivitate ================= */
var HIDE_MS = 10000, barOn = true, lastAct = Date.now(), watchdog = null,
    lastX = -1, lastY = -1;

function playerOpen(){
  return !!window.__modalOpen || pl.classList.contains('on');
}
function showBar(){
  barOn = true;
  lastAct = Date.now();
  bar.style.display = '';
  hint.style.display = '';
  /* forteaza repaint in WebView-urile de Android TV */
  void bar.offsetHeight;
  bar.classList.remove('off');
  hint.classList.remove('off');
  hot.style.display = 'none';
  startWatch();
}
function hideBar(){
  if (!playerOpen()) return;
  barOn = false;
  bar.classList.add('off');
  hint.classList.add('off');
  /* display:none garanteaza dispariția si pe WebView-urile care nu repicteaza opacity peste video */
  bar.style.display = 'none';
  hint.style.display = 'none';
  hot.style.display = 'block';
  try { if (document.activeElement === closeBtn) closeBtn.blur(); } catch(e){}
}
/* watchdog: verifica inactivitatea o data pe secunda (imun la setTimeout pierdut/throttled) */
function startWatch(){
  if (watchdog) return;
  watchdog = setInterval(function(){
    if (!playerOpen()){ stopWatch(); return; }
    if (barOn && (Date.now() - lastAct) >= HIDE_MS) hideBar();
  }, 1000);
}
function stopWatch(){
  if (watchdog){ clearInterval(watchdog); watchdog = null; }
}
function armHide(){ lastAct = Date.now(); startWatch(); }

/* orice activitate reala reafiseaza bara si reseteaza cele 10s */
function bump(){
  if (!playerOpen()) return;
  lastAct = Date.now();
  if (!barOn) showBar(); else startWatch();
}
window.__romyActivity = bump;
window.__romyBarState = function(){
  return JSON.stringify({open: playerOpen(), barOn: barOn, idle: Date.now() - lastAct, watch: !!watchdog});
};

/* mousemove: ignora tremuratul pointerului (air-mouse) sub 6px, altfel bara nu s-ar ascunde niciodata */
document.addEventListener('mousemove', function(e){
  var dx = Math.abs(e.clientX - lastX), dy = Math.abs(e.clientY - lastY);
  if (lastX >= 0 && dx < 6 && dy < 6) return;
  lastX = e.clientX; lastY = e.clientY;
  bump();
}, true);
['mousedown','click','wheel','touchstart','touchmove'].forEach(function(ev){
  document.addEventListener(ev, bump, true);
});
['mousemove','mousedown','click','touchstart','wheel'].forEach(function(ev){
  hot.addEventListener(ev, function(e){ e.stopPropagation(); if (ev !== 'mousemove') e.preventDefault(); showBar(); });
});

/* ================= OK / SELECT de la telecomanda ================= */
var lastSel = null;

document.addEventListener('focusin', function(e){
  var el = e.target;
  if (el && el.closest){ var c = el.closest('.card,.chip'); if (c) lastSel = c; }
}, true);
document.addEventListener('mouseover', function(e){
  var el = e.target && e.target.closest ? e.target.closest('.card,.chip') : null;
  if (el) lastSel = el;
}, true);

function currentTarget(){
  var a = document.activeElement;
  if (a && a.closest){
    var c = a.closest('.card,.chip,#close,#search');
    if (c) return c;
  }
  return lastSel;
}

/* apelata de aplicatie cand se apasa OK/Play pe telecomanda */
function okAction(){
  if (window.__modalOpen){
    if (!barOn){ showBar(); return true; }          /* prima apasare: doar arata bara */
    closePlayer(); return true;                      /* a doua apasare: inchide */
  }
  var el = currentTarget();
  if (!el || el === search) el = lastSel || document.querySelector('.card');
  if (el){
    try { el.focus(); } catch(e){}
    lastSel = (el.classList && (el.classList.contains('card') || el.classList.contains('chip'))) ? el : lastSel;
    el.click();
    return true;
  }
  return false;
}
window.__romyPlayerAction = okAction;
window.__romyOk = okAction;
window.__romySelect = okAction;
window.__romyClick = okAction;

function isOkKey(e){
  var k = e.keyCode || 0;
  if (k === 13 || k === 23 || k === 66 || k === 32 || k === 62 || k === 85 || k === 96 || k === 160) return true;
  if (e.key === 'Enter' || e.key === 'Select' || e.key === ' ' || e.key === 'Spacebar') return true;
  /* OK nemapat pe unele telecomande: keyCode 0 / key nedefinit */
  if (k === 0 && (!e.key || e.key === 'Unidentified')) return true;
  return false;
}

document.addEventListener('keydown', function(e){
  var k = e.keyCode || 0;

  /* BACK / ESC inchide playerul */
  if (k === 4 || k === 27 || e.key === 'Escape' || e.key === 'GoBack' || e.key === 'BrowserBack'){
    if (window.__modalOpen){ closePlayer(); e.preventDefault(); e.stopPropagation(); }
    return;
  }

  bump();

  /* in caseta de cautare lasam tastatura sa lucreze normal */
  if (e.target === search && !window.__modalOpen){
    if (isOkKey(e) && k !== 32){ e.preventDefault(); try{ search.blur(); }catch(_){} 
      var f = lastSel || document.querySelector('.card'); if (f){ try{f.focus();}catch(__){} } }
    return;
  }

  if (isOkKey(e)){
    if (okAction()){ e.preventDefault(); e.stopPropagation(); }
    return;
  }

  /* daca nimic nu e focusat si se apasa o directie, focuseaza primul canal */
  if ((k >= 19 && k <= 22) || (k >= 37 && k <= 40)){
    var a = document.activeElement;
    if (!a || a === document.body || a === document.documentElement){
      var first = lastSel || document.querySelector('.card');
      if (first){ try { first.focus(); } catch(_){} e.preventDefault(); }
    }
  }
}, true);

document.addEventListener('keyup', function(e){ bump(); }, true);

/* focus initial pe primul canal, ca OK sa functioneze imediat */
setTimeout(function(){
  var f = document.querySelector('.card');
  if (f && (document.activeElement === document.body || !document.activeElement)){
    lastSel = f; try { f.focus(); } catch(e){}
  }
}, 350);

search.addEventListener('input', function(){ q = search.value || ''; render(); });
render();
</script>
